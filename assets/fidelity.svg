<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" role="img" aria-label="保真度四级：F0 摘录逐字、F1 摘录推导、F2 功能对齐、F3 教学填充"><rect width="900" height="430" rx="16" fill="#f7f6f2"/><text x="32" y="56" font-family="Inter,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="28" fill="#1b1b1a" font-weight="600" letter-spacing="-0.7">保真度四级</text><text x="32" y="84" font-family="Inter,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#7c7a72">每个披露点标一级——有公开摘录的逐字落进宿主，无摘录的按披露功能对齐，其余填充。</text><rect x="32" y="112" width="198" height="230" rx="12" fill="#fcfcfb" stroke="#e6e3da"/><text x="52" y="148" font-family="Menlo, Consolas, monospace" font-size="19" fill="#1b1b1a" font-weight="600">F0</text><text x="52" y="170" font-family="Inter,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#1b1b1a" font-weight="600">摘录逐字复现</text><text x="52" y="192" font-family="Inter,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#7c7a72">公开摘录的语义逐字</text><text x="52" y="209" font-family="Inter,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#7c7a72">落进模拟宿主</text><text x="52" y="258" font-family="Inter,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#7c7a72">maximize / clip×2</text><text x="52" y="275" font-family="Inter,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#7c7a72">时间种子 / utime / NaN</text><text x="52" y="318" font-family="Menlo, Consolas, monospace" font-size="22" fill="#2e8b62" font-weight="600">7 项</text><circle cx="180" cy="311" r="5" fill="#2e8b62"/><rect x="242" y="112" width="198" height="230" rx="12" fill="#fcfcfb" stroke="#e6e3da"/><text x="262" y="148" font-family="Menlo, Consolas, monospace" font-size="19" fill="#1b1b1a" font-weight="600">F1</text><text x="262" y="170" font-family="Inter,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#1b1b1a" font-weight="600">摘录推导</text><text x="262" y="192" font-family="Inter,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#7c7a72">摘录在，但需适配调用点</text><text x="262" y="209" font-family="Inter,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#7c7a72">推导处标注 H</text><text x="262" y="258" font-family="Inter,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#7c7a72">通信 wrapper（31 调用点）</text><text x="262" y="275" font-family="Inter,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#7c7a72">确定性装置</text><text x="262" y="318" font-family="Menlo, Consolas, monospace" font-size="22" fill="#1b1b1a" font-weight="600">8 项</text><circle cx="390" cy="311" r="5" fill="#d8d5cb"/><rect x="452" y="112" width="198" height="230" rx="12" fill="#fcfcfb" stroke="#e6e3da"/><text x="472" y="148" font-family="Menlo, Consolas, monospace" font-size="19" fill="#1b1b1a" font-weight="600">F2</text><text x="472" y="170" font-family="Inter,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#1b1b1a" font-weight="600">功能对齐</text><text x="472" y="192" font-family="Inter,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#7c7a72">无公开代码，按披露的</text><text x="472" y="209" font-family="Inter,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#7c7a72">功能描述实现等效行为</text><text x="472" y="258" font-family="Inter,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#7c7a72">T5 载体 / 命令通道</text><text x="472" y="275" font-family="Inter,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#7c7a72">定点终止 / 时间戳还原</text><text x="472" y="318" font-family="Menlo, Consolas, monospace" font-size="22" fill="#1b1b1a" font-weight="600">21 项</text><circle cx="600" cy="311" r="5" fill="#d8d5cb"/><rect x="662" y="112" width="198" height="230" rx="12" fill="#fcfcfb" stroke="#e6e3da" stroke-dasharray="5 4"/><text x="682" y="148" font-family="Menlo, Consolas, monospace" font-size="19" fill="#7c7a72" font-weight="600">F3</text><text x="682" y="170" font-family="Inter,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#7c7a72" font-weight="600">教学填充</text><text x="682" y="192" font-family="Inter,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#7c7a72">披露仅及背景，按合理</text><text x="682" y="209" font-family="Inter,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#7c7a72">设定填充并标注 C</text><text x="682" y="258" font-family="Inter,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#7c7a72">领导目录文件清单</text><text x="682" y="275" font-family="Inter,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#7c7a72">资源池数值</text><text x="682" y="318" font-family="Menlo, Consolas, monospace" font-size="22" fill="#7c7a72" font-weight="600">8 项</text><rect x="32" y="362" width="828" height="44" rx="12" fill="#1b1b1a"/><text x="56" y="390" font-family="Inter,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14" fill="#e8e6e1" font-weight="600">铁律：F3 永不冒充 F0 —— 升级保真度必须有新证据并记录在案</text></svg>
